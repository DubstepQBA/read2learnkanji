version: '3.8'

services:
  # Backend Flask API
  backend:
    build:
      context: ./src/furigana-api
      dockerfile: Dockerfile
    container_name: furigana-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - ./src/furigana-api:/app
      - ./jmdict.db:/app/jmdict.db:ro
    networks:
      - app-network
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: furigana-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  jmdict_data: