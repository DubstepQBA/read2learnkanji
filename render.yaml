services:
  - type: web
    name: furigana-api
    env: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr poppler-utils
      pip install --upgrade pip
      pip install -r src/furigana-api/requirements.txt
    startCommand: python src/furigana-api/app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
