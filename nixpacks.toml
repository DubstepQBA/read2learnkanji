[phases.setup]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-jpn", "poppler-utils"]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["chmod +x build.sh && ./build.sh"]

[phases.build]
cmds = []

[start]
cmd = "cd src/furigana-api && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app"

[variables]
PYTHON_VERSION = "3.11"