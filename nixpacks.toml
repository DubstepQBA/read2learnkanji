[phases.setup]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-jpn", "poppler-utils"]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["chmod +x build.sh && ./build.sh"]

[phases.build]
cmds = []

[start]
cmd = "bash -c 'echo \"Iniciando aplicación desde: $(pwd)\"; echo \"Contenido:\"; ls -la; if [ -d \"src/furigana-api\" ]; then echo \"Encontrado src/furigana-api\"; cd src/furigana-api && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app; elif [ -d \"furigana-api\" ]; then echo \"Encontrado furigana-api\"; cd furigana-api && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app; else echo \"ERROR: No se encontró furigana-api en $(pwd)\"; find . -name \"app.py\"; exit 1; fi'"

[variables]
PYTHON_VERSION = "3.11"