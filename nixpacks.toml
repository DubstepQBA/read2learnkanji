[phases.setup]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-jpn", "poppler-utils"]

[phases.install]
cmds = ["cd src/furigana-api && pip install -r requirements.txt"]

[start]
cmd = "cd src/furigana-api && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app"

[variables]
PYTHON_VERSION = "3.11"